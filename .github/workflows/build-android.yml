name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Verify Web Build Output
        run: |
          echo "Verifying web build output in dist/..."
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "::error::Web build directory 'dist/' or 'dist/index.html' is missing."
            ls -la
            exit 1
          fi
          echo "Web build verified successfully."

      - name: Capacitor Environment Diagnostics
        run: |
          echo "=== Capacitor & Environment Diagnostics ==="
          echo "Bun version:"
          bun --version
          echo "Capacitor CLI version:"
          bunx @capacitor/cli --version || bunx cap --version
          echo "Root directory contents:"
          ls -la
          echo "Dist directory contents:"
          ls -la dist
          if [ -d "android" ]; then
            echo "Android directory contents:"
            ls -la android
          else
            echo "Android directory does not exist yet."
          fi

      - name: Initialize and Sync Capacitor Android
        run: |
          echo "=== Capacitor Android Setup & Sync ==="
          if [ ! -d "android" ] || [ ! -f "android/build.gradle" ]; then
            echo "Android platform not initialized. Adding Android platform..."
            bunx @capacitor/cli add android
          fi
          echo "Copying web assets to native Android project..."
          bunx @capacitor/cli copy android
          echo "Syncing Capacitor Android project..."
          bunx @capacitor/cli sync android

      - name: Verify Android Project Structure
        run: |
          echo "Verifying Android project structure..."
          MISSING=0
          if [ ! -d "android" ]; then
            echo "::error::Directory 'android' does not exist."
            MISSING=1
          fi
          if [ ! -f "android/gradlew" ]; then
            echo "::error::File 'android/gradlew' does not exist."
            MISSING=1
          fi
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::File 'android/gradle/wrapper/gradle-wrapper.properties' does not exist."
            MISSING=1
          fi
          if [ $MISSING -ne 0 ]; then
            echo "Listing workspace contents for debugging:"
            ls -la
            if [ -d "android" ]; then
              echo "Listing android directory contents:"
              ls -la android
              if [ -d "android/gradle" ]; then
                echo "Listing android/gradle directory contents:"
                ls -la android/gradle
              fi
            fi
            echo "Required Android/Gradle files are missing. Failing workflow."
            exit 1
          fi
          echo "All required Android and Gradle files verified successfully."

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Manager-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

